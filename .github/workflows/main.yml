name: Update SideStore Source

on:
  release:
    # created는 published와 함께 발생하므로 넣으면 릴리즈 1건에 두 번 돈다
    types: [published, edited]
  # 기존 릴리즈에 에셋만 덧붙이면 release 이벤트가 발생하지 않는다.
  # 위 트리거만으로는 새 IPA를 놓치므로 주기 실행이 필요하다.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      use_spotify_mirror:
        description: 'Spotify 미러 소스 동기화'
        type: boolean
        default: false

# 동시에 두 개가 돌면 pull --ff-only 이후 push가 경합해 한쪽이 실패한다.
# 취소하지 않고 순서대로 실행되도록 직렬화한다.
concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sync main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git fetch origin main
          git checkout main
          git pull origin main --ff-only

      - name: Run Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 자동 트리거는 항상 true, workflow_dispatch는 체크박스 값을 따른다
          USE_SPOTIFY_MIRROR: ${{ github.event_name != 'workflow_dispatch' || inputs.use_spotify_mirror }}
        run: python update_source.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add "NightFox.json"
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync mirror and update minOSVersion [skip ci]"
            git push origin HEAD:main
          else
            echo "변경 사항 없음, 푸시 스킵"
          fi
